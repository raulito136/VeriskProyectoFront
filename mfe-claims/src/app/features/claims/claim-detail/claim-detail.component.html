<div class="p-8" *ngIf="claim() as c">
  
  <lib-card>
    <div card-header>
      <div class="bg-blue-600 h-16 w-full flex items-center justify-between px-6 text-white font-bold text-xl rounded-t-xl">
        <span>Claim: {{ c.claimNumber }}</span>
        <span class="bg-blue-800 text-sm px-3 py-1 rounded-full">{{ c.statusCode }}</span>
      </div>
    </div>
    
    <div class="grid grid-cols-2 gap-4 my-4">
      <p><strong>Policy:</strong> {{ c.policyNumber }}</p>
      <p><strong>Date:</strong> {{ c.claimDate }}</p>
      <p><strong>Amount:</strong> ${{ c.amount }}</p>
      <p><strong>Description:</strong> {{ c.description }}</p>
    </div>

    <div card-footer class="p-4 bg-gray-50 flex justify-end">
      <!-- Botón para ir a cambiar estado -->
      <lib-button type="default" content="Update Status" [routerLink]="['/', c.id, 'status']"></lib-button>
    </div>
  </lib-card>

  <!-- PESTAÑAS (TABS) -->
  <div class="mt-8 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <lib-tabs [tabs]="['Comments', 'Audit History']" [activeTab]="currentTab" (onTabChange)="currentTab = $event">
    </lib-tabs>

    <div class="mt-6">
      <div *ngIf="currentTab === 'Comments'">
        <app-comment-list [comments]="c.comments || []" [claimId]="c.id"></app-comment-list>
      </div>

      <div *ngIf="currentTab === 'Audit History'">
        <app-audit-trail [audits]="c.audits || []"></app-audit-trail>
      </div>
    </div>
  </div>

</div>
