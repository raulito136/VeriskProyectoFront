<div class="p-6 bg-white rounded-lg shadow-md">
  <h1 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">
    Claim Statuses
  </h1>

  <div class="overflow-x-auto rounded-lg border border-slate-200">
    <table class="min-w-full divide-y divide-slate-200 bg-white">
      <thead class="bg-slate-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">ID</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Code</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Name</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Description</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Is Active</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        @for(claimStatus of claimsStatuses(); track claimStatus.id) {
          <tr class="hover:bg-slate-50 transition-colors duration-200">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 font-mono">
              {{ claimStatus.id }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-indigo-600">
              {{ claimStatus.code }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">
              {{ claimStatus.name }}
            </td>
            <td class="px-6 py-4 text-sm text-slate-600">
              {{ claimStatus.description }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
              <span [class]="claimStatus.isActive 
                ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800' 
                : 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800'">
                {{ claimStatus.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="px-6 py-12 text-center text-slate-400 italic bg-slate-50">
              No claim statuses found.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
