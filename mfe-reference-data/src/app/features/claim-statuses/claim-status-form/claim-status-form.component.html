<div class="p-6 max-w-4xl mx-auto">
<lib-form [title]="isEditMode ? 'Editar Claim Status' : 'Crear Claim Status'" (formSubmit)="onSubmitForm($event)">
  
  <div [formGroup]="myForm" class="flex flex-col gap-4">
    <ng-container *ngIf="!isEditMode">
      <lib-input formControlName="code" label="Código (ej: OPEN)"></lib-input>
    </ng-container>

    <lib-input formControlName="name" label="Nombre (ej: Abierto)"></lib-input>
    <lib-textarea formControlName="description" label="Descripción"></lib-textarea>

    <ng-container *ngIf="isEditMode">
      <lib-switch 
        label="Estado Activo" 
        [checked]="myForm.get('isActive')?.value ?? false" 
        (checkedChange)="myForm.get('isActive')?.setValue($event)">
      </lib-switch>
    </ng-container>
  </div>

  <div form-actions class="flex gap-2 justify-end">
    <lib-button type="cancel" content="Cancelar" (buttonClick)="onCancel()"></lib-button>
    <lib-button type="submit" [content]="isEditMode ? 'Guardar' : 'Crear'" [disabled]="myForm.invalid"></lib-button>
  </div>

</lib-form>
</div>
